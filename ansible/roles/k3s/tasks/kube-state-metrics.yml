---
# SECTION 1: LINUX KERNEL PERFORMANCE OPTIMIZATIONS (KSM) =======================
- name: Ativar Kernel Samepage Merging (KSM) em tempo de execucao
  ansible.builtin.shell:
    cmd: echo 1 > /sys/kernel/mm/ksm/run
  changed_when: true

- name: Garantir que o diretorio /etc/sysfs.d existe
  ansible.builtin.file:
    path: /etc/sysfs.d
    state: directory
    mode: '0755'

- name: Garantir persistencia do KSM no boot do sistema
  ansible.builtin.copy:
    dest: /etc/sysfs.d/ksm.conf
    content: |
      kernel/mm/ksm/run = 1
    mode: '0644'
  ignore_errors: true

# SECTION 2: LIGHTWEIGHT K3S ENGINE BOOTSTRAP ===================================
- name: Baixar e rodar o instalador do k3s limpando os plugins pesados de RAM
  ansible.builtin.shell: |
    curl -sfL https://k3s.io | INSTALL_K3S_EXEC="--disable traefik --disable local-storage --disable metrics-server" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Ajustar permissoes de leitura do Kubeconfig para o usuario local
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Aguardar ate que o nó local mude para status Ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=60s
  changed_when: false

# SECTION 3: DEPLOY KUBE-STATE-METRICS =========================================
- name: Criar diretório temporário do kube-state-metrics
  ansible.builtin.file:
    path: /tmp/kube-state-metrics
    state: directory
    mode: '0755'

- name: Baixar manifests do kube-state-metrics
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/kubernetes/kube-state-metrics/v2.17.0/examples/standard/{{ item }}"
    dest: "/tmp/kube-state-metrics/{{ item }}"
    mode: '0644'
  loop:
    - service-account.yaml
    - cluster-role.yaml
    - cluster-role-binding.yaml
    - deployment.yaml
    - service.yaml

- name: Limitar recursos do Deployment do KSM no laboratório local
  ansible.builtin.replace:
    path: /tmp/kube-state-metrics/deployment.yaml
    regexp: 'image: registry.k8s.io/kube-state-metrics/kube-state-metrics:.*'
    replace: 'image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0'

- name: Instalar kube-state-metrics
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/k3s kubectl apply
      -f /tmp/kube-state-metrics
  register: ksm_install
  changed_when: >
    'created' in ksm_install.stdout or
    'configured' in ksm_install.stdout

- name: Aguardar kube-state-metrics ficar disponível
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/k3s kubectl
      wait
      --for=condition=Available
      deployment/kube-state-metrics
      -n kube-system
      --timeout=120s
  register: ksm_ready
  retries: 5             # Aumentado levemente para dar margem de segurança no Rocky 9
  delay: 15              # Aumentado levemente para evitar falhas de timeout por rede lenta
  until: ksm_ready.rc == 0
  changed_when: false

- name: Verificar pod do kube-state-metrics
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/k3s kubectl
      get pods
      -n kube-system
      -l app.kubernetes.io/name=kube-state-metrics
      -o wide
  register: ksm_pods
  changed_when: false

- name: Exibir status do kube-state-metrics
  ansible.builtin.debug:
    msg: "{{ ksm_pods.stdout }}"


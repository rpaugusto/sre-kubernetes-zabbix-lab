---
- name: Verificar se o binário K3s existe
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Instalar K3s
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_EXEC="--disable traefik --disable local-storage --disable metrics-server" \
      sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_bin.stat.exists

- name: Verificar versão do K3s
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_version
  changed_when: false

- name: Exibir versão do K3s
  ansible.builtin.debug:
    var: k3s_version.stdout

- name: Garantir serviço K3s iniciado
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Aguardar kubeconfig ser criado
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    timeout: 60

- name: Ajustar permissões do kubeconfig
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    owner: root
    group: root
    mode: '0644'

- name: Aguardar API Kubernetes ficar disponível
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  retries: 12
  delay: 5
  until: k3s_nodes.rc == 0
  changed_when: false

- name: Aguardar node ficar Ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=60s
  register: k3s_ready
  retries: 3
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false

- name: Exibir nodes do cluster
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes -o wide
  register: k3s_nodes_status
  changed_when: false

- name: Mostrar nodes
  ansible.builtin.debug:
    msg: "{{ k3s_nodes_status.stdout }}"

- name: Exibir pods do cluster
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get pods -A
  register: k3s_pods
  changed_when: false

- name: Mostrar pods
  ansible.builtin.debug:
    msg: "{{ k3s_pods.stdout }}"

- name: Instalar kube-state-metrics
  ansible.builtin.include_tasks:
    file: kube-state-metrics.yml
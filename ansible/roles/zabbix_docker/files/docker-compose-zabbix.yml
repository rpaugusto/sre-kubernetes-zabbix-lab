version: '3.8'

services:
  zabbix-mysql:
    image: mysql:8.0
    container_name: zabbix-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root_password_sre_2026"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password_secure"
    restart: unless-stopped
    
  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.4-latest
    container_name: zabbix-server
    ports:
      - "10051:10051"
    volumes:
      - zabbix_data:/var/lib/zabbix/export
    environment:
      DB_SERVER_HOST: zabbix-mysql
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password_secure"
      MYSQL_ROOT_PASSWORD: "root_password_sre_2026"
    restart: unless-stopped
    depends_on:
      - zabbix-mysql

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.4-latest
    container_name: zabbix-web
    ports:
      - "80:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-mysql
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password_secure"
      MYSQL_ROOT_PASSWORD: "root_password_sre_2026"
      PHP_TZ: "America/Sao_Paulo"
    restart: unless-stopped
    depends_on:
      - zabbix-mysql
  
  zabbix-agent2:
    image: zabbix/zabbix-agent2:ubuntu-7.4-latest
    container_name: zabbix_agent2
    restart: always
    user: "0:0"
    ports:
      - "10050:10050"
    environment:
      - ZBX_SERVER_HOST=zabbix-server,127.0.0.1
      - ZBX_SERVER_ACTIVE=zabbix-server,127.0.0.1
      - ZBX_HOSTNAME=zabbix_agent2
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_REFRESHACTIVECHECKS=120
    volumes:
      - /:/host:ro
      - /etc/hostname:/etc/ro_hostname:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true

volumes:
  mysql_data:
  zabbix_data:

# Defines the default network that this compose file will spin up
networks:
  default:
    name: observability-net
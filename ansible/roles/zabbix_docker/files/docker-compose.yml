version: '3.8'

services:
  zabbix-mysql:
    image: mysql:8.0
    container_name: zabbix-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root_password_sre_2026"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password_secure"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    container_name: zabbix-server
    ports:
      - "10051:10051"
    volumes:
      - zabbix_export:/var/lib/zabbix/export
    environment:
      DB_SERVER_HOST: zabbix-mysql
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password_secure"
      MYSQL_ROOT_PASSWORD: "root_password_sre_2026"
    restart: unless-stopped
    depends_on:
      zabbix-mysql:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    container_name: zabbix-web
    ports:
      - "80:8080"
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-mysql
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password_secure"
      MYSQL_ROOT_PASSWORD: "root_password_sre_2026"
      PHP_TZ: "America/Sao_Paulo"
    restart: unless-stopped
    depends_on:
      zabbix-mysql:
        condition: service_healthy

volumes:
  mysql_data:
  zabbix_export:

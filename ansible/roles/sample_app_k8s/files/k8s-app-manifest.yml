apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-corporativa-k8s
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-k8s
  template:
    metadata:
      labels:
        app: web-k8s
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "32Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: app-corporativa-k8s-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: web-k8s
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

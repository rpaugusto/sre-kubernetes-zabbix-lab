zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 745bfe86b0df45d1ac34125b3e6e1f01
      name: 'Templates/SRE Applications'
  templates:
    - uuid: 4b1a2b3c5e6f4a8ba0d1e2f3a4b5c6d7
      template: 'Template_SRE_Proxy_WAN_Latency'
      name: 'SRE - WAN & Latency Checks'
      description: |
        Official SRE Template for monitoring WAN link latency, packet loss, jitter, and reachability.
        
        Leverages the SRE Proxy API to collect ICMP/HTTP synthetic network probes across multiple targets.
        
        Developed for Zabbix 7.4.
      groups:
        - name: 'Templates/SRE Applications'
      items:
        - uuid: 5c2b3c4d6f7a4b9ca0d1e2f3a4b5c6d7
          name: 'WAN Latency - Raw JSON'
          type: HTTP_AGENT
          key: net.wan.raw
          delay: 1m
          history: 1d
          trends: '0'
          value_type: TEXT
          description: 'Fetches consolidated JSON containing WAN metrics (RTT, loss, jitter) for all target endpoints.'
          url: 'http://sre-proxy-api:8000/network/wan-summary'
          tags:
            - tag: component
              value: raw-data
            - tag: service
              value: wan-monitoring
      discovery_rules:
        - uuid: 6d3c4d5e7a8b4c0da1e2f3a4b5c6d7e8
          name: 'WAN Targets Discovery'
          type: HTTP_AGENT
          key: net.wan.discovery
          delay: 30m
          url: 'http://sre-proxy-api:8000/discovery/wan-targets'
          description: 'Discovers all monitored WAN interfaces, VPN tunnels, and network endpoints.'
          item_prototypes:
            - uuid: 7e4d5e6f8b9c40d1a2f3a4b5c6d7e8f9
              name: 'WAN [{#TARGET}] - Latency (RTT)'
              type: DEPENDENT
              key: 'net.wan.latency["{#TARGET}"]'
              delay: '0'
              history: 14d
              trends: 90d
              value_type: FLOAT
              units: ms
              description: 'Round-trip time (RTT) delay for target [{#TARGET}] in milliseconds.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#TARGET}'].rtt_ms"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 5m
              master_item:
                key: net.wan.raw
              tags:
                - tag: component
                  value: latency
                - tag: target
                  value: '{#TARGET}'
            - uuid: 8f5e6f7a9c0d41e2a3a4b5c6d7e8f9a0
              name: 'WAN [{#TARGET}] - Packet Loss'
              type: DEPENDENT
              key: 'net.wan.packet_loss["{#TARGET}"]'
              delay: '0'
              history: 14d
              trends: 90d
              value_type: FLOAT
              units: '%'
              description: 'Percentage of lost ICMP/HTTP probe packets for target [{#TARGET}].'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#TARGET}'].packet_loss"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 5m
              master_item:
                key: net.wan.raw
              tags:
                - tag: component
                  value: packet-loss
                - tag: target
                  value: '{#TARGET}'
            - uuid: 9a6f7a8b0d1e4f3aa4b5c6d7e8f9a0b1
              name: 'WAN [{#TARGET}] - Jitter'
              type: DEPENDENT
              key: 'net.wan.jitter["{#TARGET}"]'
              delay: '0'
              history: 14d
              trends: 90d
              value_type: FLOAT
              units: ms
              description: 'Packet delay variation (jitter) for target [{#TARGET}] in milliseconds.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#TARGET}'].jitter_ms"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 5m
              master_item:
                key: net.wan.raw
              tags:
                - tag: component
                  value: jitter
                - tag: target
                  value: '{#TARGET}'
            - uuid: a17a8b9c1e2f4a3ba5c6d7e8f9a0b1c2
              name: 'WAN [{#TARGET}] - Status'
              type: DEPENDENT
              key: 'net.wan.status["{#TARGET}"]'
              delay: '0'
              history: 14d
              trends: 30d
              value_type: UNSIGNED
              description: 'Reachability status for [{#TARGET}] (1 = Reachable, 0 = Unreachable/Down).'
              valuemap:
                name: 'WAN Target Status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#TARGET}'].status"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 5m
              master_item:
                key: net.wan.raw
              tags:
                - tag: component
                  value: status
                - tag: target
                  value: '{#TARGET}'
          trigger_prototypes:
            - uuid: b28b9c0d2f3a4b5ca6d7e8f9a0b1c2d3
              expression: 'last(/Template_SRE_Proxy_WAN_Latency/net.wan.status["{#TARGET}"])=0'
              name: 'WAN Link [{#TARGET}] is DOWN / Unreachable'
              priority: HIGH
              description: 'Target [{#TARGET}] is unresponsive to probe requests sent by the SRE Proxy.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: severity
                  value: high
                - tag: target
                  value: '{#TARGET}'
            - uuid: c39c0d1e3a4b4c5da7e8f9a0b1c2d3e4
              expression: 'min(/Template_SRE_Proxy_WAN_Latency/net.wan.packet_loss["{#TARGET}"],#3) > 10'
              name: 'High Packet Loss on WAN [{#TARGET}] (> 10%)'
              priority: HIGH
              description: 'Packet loss to target [{#TARGET}] has sustained over 10% across consecutive probes.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
                - tag: severity
                  value: high
                - tag: target
                  value: '{#TARGET}'
            - uuid: d40d1e2f4b5c4d7ea8f9a0b1c2d3e4f5
              expression: 'min(/Template_SRE_Proxy_WAN_Latency/net.wan.latency["{#TARGET}"],#3) > 150'
              name: 'High Latency on WAN [{#TARGET}] (> 150ms)'
              priority: WARNING
              description: 'Round-trip delay time to target [{#TARGET}] is exceeding 150ms.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: performance
                - tag: severity
                  value: warning
                - tag: target
                  value: '{#TARGET}'
      valuemaps:
        - uuid: e51e2f3a5c6d4e7fa90b1c2d3e4f5a6b
          name: 'WAN Target Status'
          mappings:
            - value: '1'
              newvalue: Online / Reachable
            - value: '0'
              newvalue: Offline / Unreachable
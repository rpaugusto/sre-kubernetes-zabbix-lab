zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 745bfe86b0df45d1ac34125b3e6e1f01
      name: 'Templates/SRE Applications'
  templates:
    - uuid: d31b2c3d4e5f4a6b8c0d1e2f3a4b5c6d
      template: 'Template_SRE_Proxy_Commodities'
      name: 'SRE - Financial Commodities'
      description: |
        Monitors Global Commodities (Gold, Silver, Brent, WTI) in USD and converts to target base currency.
        Developed for Zabbix 7.4.
      groups:
        - name: 'Templates/SRE Applications'
      macros:
        - macro: '{$COMMODITY.BASE_CURRENCY}'
          value: 'BRL'
          description: 'Local currency conversion for commodities.'
        - macro: '{$COMMODITY.LIST}'
          value: 'GOLD,SILVER,BRENT,WTI'
          description: 'List of commodities to discover and monitor.'
        - macro: '{$COMMODITY.VOLATILITY.HIGH}'
          value: '4'
          description: 'Percentage threshold for 24h price fluctuation.'
      items:
        - uuid: e42c3d4e5f6a4b7c8d0e1f2a3b4c5d6e
          name: 'Commodities - Raw JSON'
          type: HTTP_AGENT
          key: commodity.raw
          delay: 10m
          history: 1d
          trends: '0'
          value_type: TEXT
          description: 'Raw JSON output from SRE Proxy with global market prices.'
          url: 'http://sre-proxy-api:8000/financial/commodities-summary?base={$COMMODITY.BASE_CURRENCY}&symbols={$COMMODITY.LIST}'
          tags:
            - tag: component
              value: raw-data
            - tag: service
              value: commodities
      discovery_rules:
        - uuid: f53d4e5f6a7b4c8d9e0f1a2b3c4d5e6f
          name: 'Commodities Discovery'
          type: HTTP_AGENT
          key: commodity.discovery
          delay: 1h
          url: 'http://sre-proxy-api:8000/discovery/commodities?symbols={$COMMODITY.LIST}'
          description: 'Discovers active commodities endpoints.'
          item_prototypes:
            - uuid: a64e5f6a7b8c4d9ea0f1b2c3d4e5f6a7
              name: 'Commodity [{#NAME}] ({#SYMBOL}) - Price in USD'
              type: DEPENDENT
              key: 'commodity.price_usd["{#SYMBOL}"]'
              delay: '0'
              history: 30d
              trends: 90d
              value_type: FLOAT
              units: 'USD'
              description: 'Spot price in global standard currency (USD).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#SYMBOL}'].price_usd"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 15m
              master_item:
                key: commodity.raw
              tags:
                - tag: component
                  value: global-price
                - tag: symbol
                  value: '{#SYMBOL}'
            - uuid: b75f6a7b8c9d4e0fa1b2c3d4e5f6a7b8
              name: 'Commodity [{#NAME}] ({#SYMBOL}) - Price in {$COMMODITY.BASE_CURRENCY}'
              type: DEPENDENT
              key: 'commodity.price_converted["{#SYMBOL}"]'
              delay: '0'
              history: 30d
              trends: 90d
              value_type: FLOAT
              units: '{$COMMODITY.BASE_CURRENCY}'
              description: 'Spot price converted to local target currency.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#SYMBOL}'].price_converted"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 15m
              master_item:
                key: commodity.raw
              tags:
                - tag: component
                  value: local-price
                - tag: symbol
                  value: '{#SYMBOL}'
            - uuid: c85e6f7a8b9c4d1ea2b3c4d5e6f7a8b9
              name: 'Commodity [{#NAME}] ({#SYMBOL}) - 24h Change'
              type: DEPENDENT
              key: 'commodity.change_24h["{#SYMBOL}"]'
              delay: '0'
              history: 30d
              trends: 90d
              value_type: FLOAT
              units: '%'
              description: '24h market price variation percentage.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#SYMBOL}'].change_24h_pct"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 15m
              master_item:
                key: commodity.raw
              tags:
                - tag: component
                  value: volatility
                - tag: symbol
                  value: '{#SYMBOL}'
          trigger_prototypes:
            - uuid: d96f7a8b9c0d4f1aa2b3c4d5e6f7a8b9
              expression: 'abs(last(/Template_SRE_Proxy_Commodities/commodity.change_24h["{#SYMBOL}"])) > {$COMMODITY.VOLATILITY.HIGH}'
              name: 'High Fluctuation on Commodity [{#NAME}] ({ITEM.VALUE}%)'
              priority: WARNING
              description: 'Commodity [{#NAME}] fluctuated more than {$COMMODITY.VOLATILITY.HIGH}% in 24h.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: market-risk
                - tag: symbol
                  value: '{#SYMBOL}'
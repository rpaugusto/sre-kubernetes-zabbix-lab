zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 745bfe86b0df45d1ac34125b3e6e1f01
      name: 'Templates/SRE Applications'
  templates:
    - uuid: e41a2b3c5e6f4a8ba0d1e2f3a4b5c6d7
      template: 'Template_SRE_Proxy_FX_Fiat'
      name: 'SRE - Financial FX (Fiat Currencies)'
      description: |
        Monitors Fiat Currencies (USD, EUR, GBP, JPY) converted to a configurable base currency.
        Developed for Zabbix 7.4.
      groups:
        - name: 'Templates/SRE Applications'
      macros:
        - macro: '{$FX.BASE_CURRENCY}'
          value: 'BRL'
          description: 'Base target currency (e.g. BRL, USD, EUR).'
        - macro: '{$FX.FIAT_LIST}'
          value: 'USD,EUR,GBP,JPY'
          description: 'Comma-separated list of fiat currencies to discover and track.'
        - macro: '{$FX.VOLATILITY.HIGH}'
          value: '3'
          description: 'Percentage threshold for 24h price change volatility.'
      items:
        - uuid: f52b3c4d6f7a4b9ca0d1e2f3a4b5c6d7
          name: 'Fiat FX - Raw JSON'
          type: HTTP_AGENT
          key: fx.fiat.raw
          delay: 5m
          history: 1d
          trends: '0'
          value_type: TEXT
          description: 'Raw JSON output from SRE Proxy with rates relative to base currency.'
          url: 'http://sre-proxy-api:8000/financial/fiat-summary?base={$FX.BASE_CURRENCY}&symbols={$FX.FIAT_LIST}'
          tags:
            - tag: component
              value: raw-data
            - tag: service
              value: fx-fiat
      discovery_rules:
        - uuid: a63c4d5e7a8b4c0da1e2f3a4b5c6d7e8
          name: 'Fiat Currencies Discovery'
          type: HTTP_AGENT
          key: fx.fiat.discovery
          delay: 1h
          url: 'http://sre-proxy-api:8000/discovery/fiat-currencies?symbols={$FX.FIAT_LIST}'
          description: 'Discovers configured fiat currency targets.'
          item_prototypes:
            - uuid: b74d5e6f8b9c40d1a2f3a4b5c6d7e8f9
              name: 'Fiat [{#SYMBOL}] / {$FX.BASE_CURRENCY} - Spot Rate'
              type: DEPENDENT
              key: 'fx.fiat.rate["{#SYMBOL}"]'
              delay: '0'
              history: 30d
              trends: 90d
              value_type: FLOAT
              units: '{$FX.BASE_CURRENCY}'
              description: 'Current exchange rate for [{#SYMBOL}] in {$FX.BASE_CURRENCY}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#SYMBOL}'].rate"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 15m
              master_item:
                key: fx.fiat.raw
              tags:
                - tag: component
                  value: fx-rate
                - tag: symbol
                  value: '{#SYMBOL}'
            - uuid: c85e6f7a9c0d41e2a3a4b5c6d7e8f9a0
              name: 'Fiat [{#SYMBOL}] / {$FX.BASE_CURRENCY} - 24h Change'
              type: DEPENDENT
              key: 'fx.fiat.change_24h["{#SYMBOL}"]'
              delay: '0'
              history: 30d
              trends: 90d
              value_type: FLOAT
              units: '%'
              description: 'Percentage variation over 24 hours.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.['{#SYMBOL}'].change_24h_pct"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 15m
              master_item:
                key: fx.fiat.raw
              tags:
                - tag: component
                  value: volatility
                - tag: symbol
                  value: '{#SYMBOL}'
          trigger_prototypes:
            - uuid: d96f7a8b0d1e4f3aa4b5c6d7e8f9a0b1
              expression: 'abs(last(/Template_SRE_Proxy_FX_Fiat/fx.fiat.change_24h["{#SYMBOL}"])) > {$FX.VOLATILITY.HIGH}'
              name: 'High Volatility on Fiat [{#SYMBOL}] ({ITEM.VALUE}%)'
              priority: WARNING
              description: 'Fiat currency [{#SYMBOL}] fluctuated more than {$FX.VOLATILITY.HIGH}% in 24h.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: market-risk
                - tag: symbol
                  value: '{#SYMBOL}'
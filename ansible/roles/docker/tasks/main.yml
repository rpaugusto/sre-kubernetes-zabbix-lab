---
- name: Adicionar repositorio oficial do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Instalar Docker Engine e plugins
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Habilitar e iniciar Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Adicionar vagrant ao grupo docker
  ansible.builtin.user:
    name: vagrant
    groups:
      - docker
    append: true
---
- name: SRE Lab - Provisionamento da Stack de Observabilidade
  hosts: all
  become: true

  # CAMADA 1: Tarefas isoladas de Sistema Operacional
  tasks:
    - name: Carregar preparações básicas da máquina virtual
      ansible.builtin.include_tasks: tasks/system_bootstrap.yml

  # CAMADA 2: Roles de Aplicativos e Serviços
  roles:
    - docker_observability
    - kubernetes_lab
